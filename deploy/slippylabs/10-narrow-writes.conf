[Service]
# The base unit made the whole of /opt/mission-dashboard writable, which
# includes app.py and ll2.py -- a code-execution bug in the service could
# rewrite the code that serves it. Every other app service narrows to its data
# directory; this brings this one into line.
#
# The empty assignment resets the inherited list before the narrow ones are
# added; without it a drop-in can only append.
ReadWritePaths=
# The only two things it writes at runtime: cache/ holds the Launch Library
# feed snapshots and the image cache (app.py:162), and .gunicorn/ is where
# gunicorn 26 puts its control socket. Bytecode caching is disabled rather than
# left to fail silently against a now-read-only __pycache__.
ReadWritePaths=/opt/mission-dashboard/cache
ReadWritePaths=/opt/mission-dashboard/.gunicorn
Environment=PYTHONDONTWRITEBYTECODE=1
