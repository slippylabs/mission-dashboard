server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mission.slippylabs.com;
    include snippets/security-headers.conf;
    include snippets/block-dotfiles.conf;

    ssl_certificate     /etc/letsencrypt/live/slippylabs-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/slippylabs-wildcard/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/mission.slippylabs.com;
    index index.html;

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8024/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # A cold image-proxy miss has to fetch from the upstream CDN first.
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location ~* \.(css|js)$ {
        include snippets/security-headers.conf;
        try_files $uri =404;
        # 5 min fresh, then serve stale while revalidating in the background.
        # Not immutable: 37 css/js refs sitewide carry no ?v= (and ES-module
        # imports never do), so a long max-age would pin stale app code in
        # browsers. This still kills the bulk of the 304 revalidation traffic.
        add_header Cache-Control "max-age=300, stale-while-revalidate=86400" always;
    }

    location ~* \.(png|jpe?g|webp|gif|ico|svg|avif|woff2?|ttf|otf|eot|mp3|ogg|wav|mp4|webm|wasm)$ {
        # add_header in a location drops every inherited header, so the security
        # snippet has to be repeated here -- same reason as the css/js block above.
        include snippets/security-headers.conf;
        try_files $uri =404;
        # 30d, deliberately NOT immutable: tools/capture_shots.py regenerates the
        # hub card banners and og-images in place under the same filename with no
        # ?v= buster, so a year-long pin would freeze stale artwork. s-w-r keeps
        # repeat views instant while a new banner propagates within a day.
        add_header Cache-Control "max-age=2592000, stale-while-revalidate=86400" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
